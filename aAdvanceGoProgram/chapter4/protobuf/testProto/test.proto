// 生成Go代码
// protoc --go_out=. test.proto
syntax = "proto3";
package testProto;

// 指定生成的rpc包名
option go_package = "chapter4/protobuf/testProto;testProto";

import "google/protobuf/duration.proto";


message String{
    string value = 1;
}

// protoc --go_out=plugins=grpc:. test.proto
service TestService{
    rpc Test (String) returns (String);
}


message Server {
    message HTTP {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }
    message GRPC {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }
    HTTP http = 1;
    GRPC grpc = 2;
}